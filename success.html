<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tune4Me Plus Activated</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #007AFF;
            outline-offset: 3px;
        }
    </style>
</head>

<body style="font-family: Arial, sans-serif; text-align:center; padding:30px; background:#f4f4f4;">

    <main>

    <h1>🎧 Tune4Me Plus Activated</h1>

    <p>Your music archive has been expanded by 25 additional saves.</p>

    <p>Thank you for supporting Tune4Me.</p>

    <p style="font-size:13px; color:#666; line-height:1.5;">
        This optional archive expansion is stored in this browser on this device.
    </p>

    <button onclick="goBack()" style="
        padding:12px 16px;
        border:none;
        border-radius:6px;
        background:#2E7D32;
        color:white;
        cursor:pointer;
    ">
        Return to Tune4Me
    </button>

    <script>

        function trackTune4MeBetaEvent(eventName) {
            const body = JSON.stringify({ event: eventName });

            if (navigator.sendBeacon) {
                navigator.sendBeacon(
                    "/api/analytics",
                    new Blob([body], { type: "application/json" })
                );
                return;
            }

            fetch("/api/analytics", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body,
                keepalive: true
            }).catch(() => { });
        }

        const upgraded = sessionStorage.getItem("upgradeApplied");

        if (!upgraded) {

            let currentLimit =
                parseInt(localStorage.getItem("saveLimit")) || 15;

            currentLimit += 25;

            if (currentLimit > 100) {
                currentLimit = 100;
            }

            localStorage.setItem("saveLimit", currentLimit);

            localStorage.setItem("tune4mePlus", "active");

            sessionStorage.setItem("upgradeApplied", "true");

            trackTune4MeBetaEvent("upgrade_completed");
        }

        function goBack() {
            window.location.href = "/";
        }

    </script>

    <p style="font-size:12px; margin-top:24px;">
        <a href="/privacy.html">Privacy Policy</a> |
        <a href="/terms.html">Terms of Service</a>
    </p>

    </main>

    <footer class="project-credit">
        Created by Vad Monty • ChatGPT Aided
    </footer>

</body>

</html>
