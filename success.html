<!DOCTYPE html>
<html>

<head>
    <title>Tune4Me Plus Activated</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body style="font-family: Arial, sans-serif; text-align:center; padding:30px; background:#f4f4f4;">

    <h1>🎧 Tune4Me Plus Activated</h1>

    <p>Your music archive has been expanded by 25 additional saves.</p>

    <p>Thank you for supporting Tune4Me during beta testing.</p>

    <button onclick="goBack()" style="
        padding:12px 16px;
        border:none;
        border-radius:6px;
        background:#4CAF50;
        color:white;
        cursor:pointer;
    ">
        Return to Tune4Me
    </button>

    <script>

        const upgraded = sessionStorage.getItem("upgradeApplied");

        if (!upgraded) {

            let currentLimit =
                parseInt(localStorage.getItem("saveLimit")) || 10;

            currentLimit += 25;

            if (currentLimit > 100) {
                currentLimit = 100;
            }

            localStorage.setItem("saveLimit", currentLimit);

            localStorage.setItem("tune4mePlus", "active");

            sessionStorage.setItem("upgradeApplied", "true");
        }

        function goBack() {
            window.location.href = "/";
        }

    </script>

</body>

</html>
